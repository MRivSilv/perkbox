version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: perkbox
    main: .
    binary: perkbox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: packages
    package_name: perkbox
    homepage: https://github.com/MRivSilv/perkbox
    maintainer: MRivSilv
    description: Open source local, and lightweight password manager
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
